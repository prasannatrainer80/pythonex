<!DOCTYPE html>

<html>

<head>

    <title>Create Account</title>

</head>

<body>

<center>

<h2>Create Account</h2>

<form method="POST">

    <table>

        <tr>
            <td>Account Holder Name</td>

            <td>
                <input type="text"
                       name="name">
            </td>
        </tr>

        <tr>
            <td>Username</td>

            <td>
                <input type="text"
                       name="username">
            </td>
        </tr>

        <tr>
            <td>Passcode</td>

            <td>
                <input type="password"
                       name="passcode">
            </td>
        </tr>

        <tr>
            <td>Email</td>

            <td>
                <input type="text"
                       name="email">
            </td>
        </tr>

        <tr>
            <td>Mobile No</td>

            <td>
                <input type="text"
                       name="mobile">
            </td>
        </tr>

        <tr>
            <td>Amount</td>

            <td>
                <input type="text"
                       name="amount">
            </td>
        </tr>

        <tr>

            <td colspan="2"
                align="center">

                <input type="submit"
                       value="Create Account">

            </td>

        </tr>

    </table>

</form>

<br>

<a href="{{ url_for('index') }}">
    Back to Dashboard
</a>

</center>

</body>

</html>
