<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
</head>

<body>

<h2>Edit Employee</h2>

<form method="POST">

    <label>Employee Number:</label>

    <input type="number"
           value="{{ employee.Empno }}"
           disabled>

    <br><br>

    <label>Name:</label>

    <input type="text"
           name="name"
           value="{{ employee.Name }}"
           required>

    <br><br>

    <label>Gender:</label>

    <select name="gender" required>

        <option value="MALE"
            {% if employee.Gender == 'MALE' %}selected{% endif %}>
            MALE
        </option>

        <option value="FEMALE"
            {% if employee.Gender == 'FEMALE' %}selected{% endif %}>
            FEMALE
        </option>

    </select>

    <br><br>

    <label>Department:</label>

    <input type="text"
           name="dept"
           value="{{ employee.Dept }}"
           required>

    <br><br>

    <label>Designation:</label>

    <input type="text"
           name="desig"
           value="{{ employee.Desig }}"
           required>

    <br><br>

    <label>Basic Salary:</label>

    <input type="number"
           step="0.01"
           name="basic"
           value="{{ employee.Basic }}"
           required>

    <br><br>

    <button type="submit">Update Employee</button>

</form>

<br>

<a href="/">Back to Employee List</a>

</body>
</html>
