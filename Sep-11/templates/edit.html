<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
</head>

<body>

<h2>Edit Employee</h2>

<form method="POST">

    <label>Name</label>
    <input type="text"
           name="name"
           value="{{ employee.name }}"
           required>

    <br><br>

    <label>Email</label>
    <input type="email"
           name="email"
           value="{{ employee.email }}">

    <br><br>

    <label>Department</label>
    <input type="text"
           name="department"
           value="{{ employee.department }}">

    <br><br>

    <label>Salary</label>
    <input type="number"
           name="salary"
           step="0.01"
           value="{{ employee.salary }}">

    <br><br>

    <button type="submit">Update</button>

</form>

<a href="/">Back</a>

</body>
</html>
